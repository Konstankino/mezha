[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
mezha-spec = { path = "crates/mezha-spec" }
mezha-render = { path = "crates/mezha-render" }
mezha-hooks = { path = "crates/mezha-hooks" }
mezha-broker = { path = "crates/mezha-broker" }
mezha-verify = { path = "crates/mezha-verify" }
mezha-memory = { path = "crates/mezha-memory" }
mezha-metrics = { path = "crates/mezha-metrics" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
toml = "1.1.6"

tempfile = "3.27.0"
yaml-rust2 = "0.13.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# Small, fast release binaries for distribution.
[profile.release]
strip = true
lto = true
codegen-units = 1
