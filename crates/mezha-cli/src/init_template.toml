# mezha.toml: the single source for this project's .claude/ setup.
# Edit this file, then run `mezha compile`. Files mezha generates are
# fingerprinted; hand edits to them are kept and reported, never overwritten
# silently.

[project]
name = "{{name}}"
os_mode = "{{os_mode}}"        # full (macOS, Linux, WSL2) | native-windows
# check = "cargo test --workspace"
# languages = { instructions = "English", answers = "English" }

[policy]
# The sandbox is the boundary: with it off, every gate is advisory.
sandbox = true
# Hosts sandboxed commands may reach. Empty means no network for them.
egress_allow = []
# Commands that need a permission prompt and an active `mezha approve`.
permissions_ask = ["git push"]
# Files agents may not read (gitignore patterns; a bare name matches at any depth).
deny_reads = [".env", "*.pem", "*.key"]

# [memory]
# dream_schedule = "manual"    # nightly | manual | cron; see `mezha dream --schedule`
# dream_at = "03:00"           # local time, for nightly
# dream_cron = "15 2 * * 1-5"  # for cron
# default_scope = "project"    # project | local | user
# phi_repos = []               # repos whose agent memory must stay local
# dream_model = "sonnet"       # the model `mezha dream` runs the dreamer on
# dream_budget_usd = 1.0       # the most one role's dream may cost
# dream_max_turns = 40

# Agents, skills and rules: mezha writes the frontmatter into .claude/, and
# the body comes from a Markdown file you own under mezha/ (by default
# mezha/agents/<name>.md, mezha/skills/<name>.md, mezha/rules/<name>.md).
#
# [agent.implementer]
# description = "Implements changes in this workspace. Use for coding tasks."
# model = "sonnet"
# tools = ["Read", "Edit", "Write", "Bash(cargo test *)"]  # Bash scopes: advisory
# rule_of_two = ["untrusted_input", "private_data"]  # at most two of three
# memory = { scope = "project" }  # read-only in sessions; `mezha dream` updates it
#                                 # dream_policy = "lessons" | "verified-facts" | "attack-patterns-only"
# max_turns = 60
#
# [skill.rust-conventions]
# preset = "knowledge"
# description = "Error handling and test conventions for this workspace. Use when writing Rust code."
# paths = ["**/*.rs"]
# (`mezha skill eval rust-conventions` checks when Claude loads it and what
#  it changes, from cases in mezha/evals/rust-conventions.toml)
#
# [rule.terraform]
# paths = ["infra/**/*.tf"]
